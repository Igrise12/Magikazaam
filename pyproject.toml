[project]
name = "magikazaam"
version = "0.1.0"
description = "Prepare a playlist catalog for landmark-based song recognition"
readme = "README.md"
authors = [
    { name = "Igrise12", email = "patrickmarcel65@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
magikazaam = "magikazaam:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
